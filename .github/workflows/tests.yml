name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Does this change need the tests? A pull request that only touches docs and specs doesn't
  # (.github/scripts/needs-tests.sh, #127). Pushes to main always run them.
  changes:
    name: Changes
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: check
        name: Code or docs?
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = pull_request ]; then run=$(.github/scripts/needs-tests.sh "origin/$BASE_REF"); else run=true; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [ "$run" = true ]; then echo "Code changed: running the tests."; else echo "Docs and specs only: skipping the tests."; fi

  # The test files, split into five parallel shards balanced by duration (tests/shard.js, #112, #132).
  shard:
    name: Tests ${{ matrix.shard }}/5
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7
      # A fresh runner reads Chrome's files off a cold disk, which made the first launch take 8-10 s
      # (#134). Read them in the background while Node is set up and the non-browser tests run.
      - name: Warm up Chrome (in the background)
        run: nohup .github/scripts/warm-chrome.sh > /dev/null 2>&1 &
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Engine and browser tests (headless Chrome)
        run: node tests/shard.js ${{ matrix.shard }}/5
      - name: Chrome warm-up time
        if: always()
        run: cat "$RUNNER_TEMP/warm-chrome.txt" 2>/dev/null || echo "warm-up still running when the tests ended"

  # The required "Tests" check: passes when every shard passed, or when the change needed no tests.
  tests:
    name: Tests
    needs: [changes, shard]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    steps:
      - name: All shards passed, or none were needed
        env:
          CHANGES: ${{ needs.changes.result }}
          RUN: ${{ needs.changes.outputs.run }}
          SHARDS: ${{ needs.shard.result }}
        run: |
          test "$CHANGES" = success
          if [ "$RUN" = true ]; then test "$SHARDS" = success; else echo "Docs and specs only: tests not needed."; fi
